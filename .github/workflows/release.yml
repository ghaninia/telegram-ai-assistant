name: Release

# Push a tag like v1.2.0 (or run `make release VERSION=1.2.0`) to build the macOS app
# and publish it as a GitHub Release. Manual runs only upload the DMG as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create releases and upload assets

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-14  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read app version
        run: |
          VERSION=$(sed -nE 's/^__version__ = "(.+)"/\1/p' src/telegram_ai_bot/__init__.py)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VERSION. Use 'make release VERSION=x.y.z'."
            exit 1
          fi

      - name: Lint, test and build
        run: make build

      - name: Name the DMG after the version
        run: |
          DMG="TelegramAIBot-$VERSION-macos-arm64.dmg"
          mv dist/TelegramAIBot.dmg "dist/$DMG"
          echo "DMG=dist/$DMG" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramAIBot-${{ env.VERSION }}-macos-arm64
          path: ${{ env.DMG }}
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "Telegram AI Assistant $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
